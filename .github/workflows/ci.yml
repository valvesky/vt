name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc glslc libvulkan-dev libx11-dev fonts-dejavu-core
      - name: font
        run: |
          mkdir -p fonts
          ln -sf /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf fonts/iosevka-mono.ttf
      - name: build
        run: gcc -o build build.c && ./build
      - name: headless
        run: sh tests/headless

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: deps
        run: brew install shaderc molten-vk
      - name: font
        run: |
          mkdir -p fonts
          ln -sf /System/Library/Fonts/Supplemental/Courier\ New.ttf fonts/iosevka-mono.ttf
      - name: build
        run: cc -o build build.c && ./build
      - name: headless
        run: sh tests/headless

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-shaderc
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader
      - name: font
        run: |
          mkdir -p fonts
          cp /c/Windows/Fonts/consola.ttf fonts/iosevka-mono.ttf
      - name: build
        run: gcc -o build build.c && ./build
      - name: headless
        run: sh tests/headless
